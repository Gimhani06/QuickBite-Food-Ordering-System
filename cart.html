<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <div class="brand">
            <img src="logo1.png" class="logo" alt="QuickBite logo">
            <h1 class="site-title">QuickBite</h1>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="cart.html" class="cart-btn">Cart</a>
            <a href="login.html" class="login-link">Login</a>
        </div>
    </div>
</header>

<main class="cart-page">
    <a href="menu.html" class="back-link">Continue Shopping</a>

    <div class="cart-layout">
        <section class="cart-panel">
            <div class="panel-header">
                <div>
                    <h2>Shopping Cart</h2>
                    <p id="cart-total-items">0 items</p>
                </div>
            </div>

            <div id="cart-empty-state" class="empty-state" hidden>
                Your cart is empty. Add items from the menu to see them here.
            </div>

            <div id="cart-list" class="cart-list"></div>
        </section>

        <aside class="summary-panel">
            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="summary-subtotal">Rs.0</strong>
            </div>
            <hr>
            <div class="summary-total">
                <span>Total</span>
                <strong id="summary-total">Rs.0</strong>
            </div>

            <button type="button" class="checkout-btn">Proceed to Checkout</button>
            <p class="summary-note">Secure checkout powered by our system</p>
        </aside>
    </div>
</main>

<script src="js/script.js"></script>

</body>
</html>
